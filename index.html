<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Upload Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--fg:#fff;--mute:#8c8c8c;--card:#0b0b0b;--line:#222;--line2:#3a3a3a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{width:100%;max-width:1100px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(24px,5vw,48px)}
h1{font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:-.04em;margin:0;line-height:1.1}
h1 span{color:var(--mute);font-weight:400}
p.sub{color:var(--mute);margin:6px 0 0;font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
.tabs{display:flex;gap:2px;border:1px solid var(--line2);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 20px;border-radius:999px;transition:.15s}
.tabs button.on{background:var(--fg);color:var(--bg)}
.hide{display:none!important}

/* admin */
.panel{max-width:460px}
input[type=email],input[type=password]{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line2);border-radius:12px;background:transparent;color:var(--fg);font:inherit;outline:none;transition:.15s}
input[type=email]:focus,input[type=password]:focus{border-color:var(--fg)}
::placeholder{color:var(--mute)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600}
.btn:active{opacity:.8}
.drop{display:block;border:1px dashed var(--line2);border-radius:16px;padding:clamp(32px,8vw,56px) 16px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--fg)}
.drop b{color:var(--fg);display:block;font-size:17px;font-weight:600;margin-bottom:4px}
input[type=file]{display:none}
.out{margin-top:14px;border:1px solid var(--line2);background:none;color:var(--mute);border-radius:999px;padding:6px 16px;font-size:14px}
#status{margin:16px 0;color:var(--mute);font-size:14px;min-height:20px;word-break:break-word}

/* gallery: 1 column on phones, more on bigger screens */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111}
.item .aud{display:flex;align-items:center;padding:20px 12px;aspect-ratio:4/3}
.item audio{width:100%;height:44px}
.meta{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;color:var(--mute);gap:10px;border-top:1px solid var(--line);margin-top:auto}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:1px solid var(--line2);background:none;color:var(--mute);border-radius:999px;padding:3px 12px;font-size:13px;flex-shrink:0}
.del:hover{color:var(--fg);border-color:var(--fg)}
.empty{color:var(--mute);text-align:center;padding:60px 0}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Dev Bills<span>Uploads</span></h1>
      <p class="sub">Upload from Admin. It shows up in the Gallery.</p>
    </div>
    <div class="tabs">
      <button id="tabGallery" class="on">Gallery</button>
      <button id="tabAdmin">Admin</button>
    </div>
  </header>

  <!-- MAIN PAGE: everyone sees this -->
  <section id="gallery">
    <div id="list" class="grid"></div>
    <div id="empty" class="empty hide">Nothing here yet.</div>
  </section>

  <!-- ADMIN: login first, then upload -->
  <section id="admin" class="hide panel">
    <div id="loginBox">
      <input id="email" type="email" placeholder="Admin email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="loginBtn">Log in</button>
    </div>
    <div id="uploadBox" class="hide">
      <label class="drop" for="file"><b>Tap to choose a file</b>Image or audio from your phone</label>
      <input id="file" type="file" accept="image/*,audio/*" multiple>
      <button class="out" id="logoutBtn">Log out</button>
    </div>
    <div id="status"></div>
  </section>
</main>

<script>
/* ---------- 1. PUT YOUR SUPABASE DETAILS HERE ---------- */
const SUPABASE_URL = "https://yufppzuttdwrcwhtyffc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1ZnBwenV0dGR3cmN3aHR5ZmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzkwMjAsImV4cCI6MjEwODQ1NTAyMH0.Z95hAgB4jDbn-joEO3RVZz4-IeLgosoV5c33N7Q60_M";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let loggedIn = false;

/* ---------- 2. Tabs ---------- */
function show(tab){
  $("gallery").classList.toggle("hide", tab !== "gallery");
  $("admin").classList.toggle("hide", tab !== "admin");
  $("tabGallery").classList.toggle("on", tab === "gallery");
  $("tabAdmin").classList.toggle("on", tab === "admin");
}
$("tabGallery").onclick = () => show("gallery");
$("tabAdmin").onclick = () => show("admin");

/* ---------- 3. Login / logout ---------- */
$("loginBtn").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value, password: $("password").value
  });
  $("status").textContent = error ? "Login failed: " + error.message : "";
};
$("logoutBtn").onclick = () => sb.auth.signOut();

// Runs on page load and every time you log in or out
sb.auth.onAuthStateChange((event, session) => {
  loggedIn = !!session;
  $("loginBox").classList.toggle("hide", loggedIn);
  $("uploadBox").classList.toggle("hide", !loggedIn);
  loadGallery();   // redraw so Delete buttons appear or disappear
});

/* ---------- 4. Upload: file -> storage bucket -> save in table ---------- */
$("file").onchange = async e => {
  for (const f of e.target.files) {
    $("status").textContent = "Uploading " + f.name + "…";
    const path = Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    // step A: store the file
    const up = await sb.storage.from("media").upload(path, f);
    if (up.error) { $("status").textContent = "Failed: " + up.error.message; continue; }

    // step B: get its public link
    const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;

    // step C: remember it in the table
    const ins = await sb.from("uploads").insert({
      name: f.name, url, path,
      kind: f.type.startsWith("audio") ? "audio" : "image"
    });
    $("status").textContent = ins.error ? "Failed: " + ins.error.message : "Done: " + f.name;
  }
  e.target.value = "";
  loadGallery();
  show("gallery");
};

/* ---------- 5. Read the table and show it on the main page ---------- */
async function loadGallery(){
  const { data, error } = await sb.from("uploads").select("*").order("created_at", { ascending: false });
  const items = data || [];
  const list = $("list");
  list.innerHTML = "";
  $("empty").classList.toggle("hide", items.length > 0);
  if (error) { $("empty").classList.remove("hide"); $("empty").textContent = "Could not load: " + error.message; }

  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "item";

    const media = document.createElement(it.kind === "audio" ? "audio" : "img");
    media.src = it.url;
    if (it.kind === "audio") media.controls = true; else { media.alt = it.name; media.loading = "lazy"; }
    let top = media;
    if (it.kind === "audio") { top = document.createElement("div"); top.className = "aud"; top.append(media); }

    const meta = document.createElement("div");
    meta.className = "meta";
    const label = document.createElement("span");
    label.textContent = it.name;
    meta.append(label);

    if (loggedIn) {   // only you see the Delete button
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete";
      del.onclick = async () => {
        await sb.storage.from("media").remove([it.path]);
        await sb.from("uploads").delete().eq("id", it.id);
        loadGallery();
      };
      meta.append(del);
    }
    card.append(top, meta);
    list.append(card);
  });
}
loadGallery();
</script>
</body>
</html>
